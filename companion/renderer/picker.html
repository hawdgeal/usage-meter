<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Pick a color</title>
<style>
  /* Nearly transparent, so the layer still takes the click; the companion hides it before reading the pixel. */
  html, body { margin: 0; height: 100%; background: rgba(0, 0, 0, 0.004); cursor: crosshair; overflow: hidden; user-select: none; }
  .tip { position: fixed; display: flex; align-items: center; gap: 8px; padding: 6px 9px 6px 6px; border-radius: 9px;
    background: #202020; color: #f1f1f1; border: 1px solid #3a3a3a; box-shadow: 0 4px 18px #0007;
    font: 12px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; pointer-events: none; white-space: nowrap; }
  .swatch { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #ffffff55; }
  .hint { color: #a8a8a8; font: 11px/1.3 "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="tip" id="tip" hidden><span class="swatch" id="swatch"></span><span><span id="hex"></span><br><span class="hint">Click to pick · Esc to cancel</span></span></div>
<script src="picker.js"></script>
</body>
</html>
